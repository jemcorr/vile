[package]
name = "vile-cli"
description = "The vile command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "vile"
path = "src/main.rs"

[dependencies]
serde_json = "=1.0.154"
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
vile-core = { path = "../vile-core" }

[dev-dependencies]
assert_cmd = "=2.2.2"
predicates = "=3.1.4"
tempfile = "=3.27.0"
