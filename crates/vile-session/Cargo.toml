[package]
name = "vile-session"
description = "Editing session and view models for the vile desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
