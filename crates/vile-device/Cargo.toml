[package]
name = "vile-device"
description = "Read-only Vial identification, definition and macro capacity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"

[dependencies]
hidapi = { version = "=2.6.7", features = ["macos-shared-device"] }
xz2 = "=0.1.7"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
vile-core = { path = "../vile-core" }

[dev-dependencies]
tempfile = "=3.27.0"
