name: Release v0.1.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: app
          - os: ubuntu-24.04
            bundle: deb
          - os: windows-latest
            bundle: nsis

    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.1.0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: swatinem/rust-cache@v2

      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: npm ci
        working-directory: app
      - run: npm run check
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: npm run tauri -- build --bundles ${{ matrix.bundle }}
        working-directory: app

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent \
            target/release/bundle/macos/vile.app \
            "release-assets/vile_0.1.0_macos_$(uname -m).app.zip"

      - name: Package Linux installer
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-assets
          mapfile -t packages < <(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb')
          test "${#packages[@]}" -eq 1
          cp "${packages[0]}" release-assets/vile_0.1.0_linux_amd64.deb

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $installers = @(Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer; found $($installers.Count)." }
          Copy-Item $installers[0].FullName release-assets/vile_0.1.0_windows_x64_setup.exe

      - uses: actions/upload-artifact@v7
        with:
          name: vile-${{ matrix.bundle }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1
