name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated tag to build and publish, such as v0.2.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: app
          - os: ubuntu-24.04
            bundle: deb
          - os: windows-latest
            bundle: nsis

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Check the tag matches the app version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          test "v$version" = "$TAG" || { echo "Tag $TAG does not match app version $version."; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm install --global npm@12.2.1

      - uses: swatinem/rust-cache@v2.9.3

      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: npm ci
        working-directory: app
      - run: npm run check
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: npm run tauri -- build --bundles ${{ matrix.bundle }}
        working-directory: app

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent \
            target/release/bundle/macos/vile.app \
            "release-assets/vile_${VERSION}_macos_$(uname -m).app.zip"

      - name: Package Linux installer
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-assets
          mapfile -t packages < <(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb')
          test "${#packages[@]}" -eq 1
          cp "${packages[0]}" "release-assets/vile_${VERSION}_linux_amd64.deb"

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $installers = @(Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer; found $($installers.Count)." }
          Copy-Item $installers[0].FullName "release-assets/vile_$($env:VERSION)_windows_x64_setup.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: vile-${{ matrix.bundle }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  appimage:
    # Ubuntu 22.04 keeps the bundled glibc requirement low enough for older distributions.
    name: Build AppImage (ubuntu-22.04)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Check the tag matches the app version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          test "v$version" = "$TAG" || { echo "Tag $TAG does not match app version $version."; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            patchelf \
            libfuse2 \
            binutils \
            xvfb

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm install --global npm@12.2.1

      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: npm run tauri -- build --bundles appimage
        working-directory: app

      - name: Package and inspect AppImage
        run: |
          mkdir -p release-assets
          appimage="$GITHUB_WORKSPACE/release-assets/vile_${VERSION}_linux_amd64.AppImage"
          mapfile -t appimages < <(find target/release/bundle/appimage -maxdepth 1 -type f -iname '*.appimage')
          test "${#appimages[@]}" -eq 1
          cp "${appimages[0]}" "$appimage"
          chmod +x "$appimage"
          file "$appimage" | grep -E 'ELF 64-bit.*x86-64'

          inspection_dir=$(mktemp -d)
          cd "$inspection_dir"
          "$appimage" --appimage-extract
          test -x squashfs-root/AppRun
          test -n "$(find squashfs-root -type f -name 'vile.desktop' -print -quit)"
          app_binary=$(find squashfs-root -type f -path '*/usr/bin/vile-app' -print -quit)
          test -n "$app_binary"
          file "$app_binary" | grep -E 'ELF 64-bit.*x86-64'

          max_glibc=0
          for elf in "$app_binary" $(find squashfs-root -type f \( -name '*.so' -o -name '*.so.*' \)); do
            required=$(readelf --version-info "$elf" 2>/dev/null | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)*' | sed 's/^GLIBC_//' | sort -V | tail -n 1 || true)
            if [ -n "$required" ] && [ "$(printf '%s\n' "$max_glibc" "$required" | sort -V | tail -n 1)" = "$required" ]; then
              max_glibc="$required"
            fi
          done
          host_glibc=$(getconf GNU_LIBC_VERSION | awk '{print $2}')
          printf 'Highest GLIBC symbol version in app and bundled libraries: %s\n' "$max_glibc"
          printf 'Ubuntu 22.04 build host GLIBC version: %s\n' "$host_glibc"
          if [ "$(printf '%s\n' "$host_glibc" "$max_glibc" | sort -V | tail -n 1)" != "$host_glibc" ]; then
            echo "AppImage requires GLIBC $max_glibc, newer than the build host's GLIBC $host_glibc."
            exit 1
          fi

          mkdir -p "$inspection_dir/home" "$inspection_dir/config" "$inspection_dir/data"
          run_status=0
          timeout --signal=TERM --kill-after=5s 20s xvfb-run -a env \
            HOME="$inspection_dir/home" \
            XDG_CONFIG_HOME="$inspection_dir/config" \
            XDG_DATA_HOME="$inspection_dir/data" \
            APPIMAGE_EXTRACT_AND_RUN=1 \
            "$appimage" \
            > "$inspection_dir/app-run.log" 2>&1 || run_status=$?
          if [ "$run_status" -ne 0 ] && [ "$run_status" -ne 124 ]; then
            cat "$inspection_dir/app-run.log"
            exit "$run_status"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: vile-appimage
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release
    needs: [build, appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: vile-*
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          test "$(ls release-assets | wc -l)" -eq 5
          (cd release-assets && sha256sum -- * > SHA256SUMS && sha256sum -c SHA256SUMS)
          # The notes are this version's changelog section, without its heading.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version."; exit 1; }
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; not overwriting it."
            exit 1
          fi
          gh release create "$TAG" --verify-tag --title "vile $TAG" --notes-file notes.md release-assets/*
